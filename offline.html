<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | ReelSense</title>
    <link rel="stylesheet" href="styles.css"> <!-- Link to external styles (might not load offline, hence inline styles) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Righteous&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#E91E63">
     <link rel="icon" href="favicon.ico" sizes="any">
     <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        /* Minimal inlined styles for offline page - Ensure basic usability */
        :root { --primary-color: #E91E63; --primary-hover: #C2185B; --secondary-color: #FFC107; --darker-color: #0D1128; --lighter-color: #FFFFFF; --text-light: #F8F9FA; --text-muted: #9FA8DA; --border-radius: 16px; }
        body { margin: 0; font-family: 'Nunito', sans-serif; background-color: #f8f9fa; color: #212529; display: flex; flex-direction: column; min-height: 100vh; }
        .container { width: 90%; max-width: 600px; margin: 0 auto; padding: 0 1rem; }

        .offline-header { background-color: var(--darker-color); color: var(--text-light); padding: 1rem 0; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2); text-align: center; }
        .offline-header .logo h1 { font-family: 'Righteous', cursive; font-size: 1.8rem; margin-bottom: 0.25rem; background: linear-gradient(90deg, var(--primary-color), var(--secondary-color)); -webkit-background-clip: text; background-clip: text; color: transparent; display: inline-block; }
        .offline-header .tagline { font-size: 0.85rem; color: var(--text-muted); font-style: italic; }
        a { color: var(--primary-color); text-decoration: none; font-weight: 700;}
        a:hover { color: var(--primary-hover); }

        main { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 0; }
        .offline-container { text-align: center; padding: 3rem 2rem; margin: 2rem auto; background-color: var(--lighter-color); border-radius: var(--border-radius); box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1); max-width: 500px;}
        .offline-icon { font-size: 4rem; color: var(--primary-color); margin-bottom: 1.5rem; }
        .offline-container h1 { margin-bottom: 1rem; color: var(--primary-color); font-family: 'Righteous', cursive; font-size: 2.2rem; }
        .offline-container p { margin-bottom: 2.5rem; color: #495057; line-height: 1.7; font-size: 1.1rem;}

        .btn { display: inline-block; padding: 0.9rem 2.2rem; background-color: var(--primary-color); color: var(--lighter-color) !important; text-decoration: none; border-radius: 50px; transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.2s ease; border: none; cursor: pointer; font-weight: 800; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .btn:hover { background-color: var(--primary-hover); box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2); transform: translateY(-3px); }

        /* Basic dark mode support via media query (won't reflect theme toggle state) */
        @media (prefers-color-scheme: dark) {
          body { background-color: #121212; color: #E0E0E0; }
          .offline-header { background-color: #00001A; color: var(--text-light); }
          .offline-header .tagline { color: var(--text-muted); }
          .offline-container { background-color: #1A237E; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4); color: var(--text-light)}
          .offline-container p { color: #E8EAF6; }
          :root { --primary-color: #EC407A; --primary-hover: #F06292; }
        }
    </style>
</head>
<body>
    <header class="offline-header">
        <div class="container">
            <div class="logo">
                 <a href="index.html" aria-label="ReelSense Home"><h1>ReelSense</h1></a>
                 <p class="tagline">Your guide through the world of cinema.</p>
            </div>
        </div>
    </header>

    <main>
      <div class="offline-container">
          <div class="offline-icon">
              <i class="fas fa-cloud-slash"></i>
          </div>
          <h1>You Appear To Be Offline</h1>
          <p>We couldn't connect to the network. Don't worry, any pages you've visited recently might still be available. Please check your connection and try again.</p>
          <a href="index.html" class="btn">Try Homepage</a>
      </div>
    </main>
</body>
</html>
